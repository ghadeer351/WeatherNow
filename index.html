<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
/>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="card">
    <div class="header">
      <h1>Weather App</h1>
      <p>Enter a city to get the current weather</p>
    </div>

    
      <div class="search-row">
        <form id="search-form" class="search-form">
          <input type="text" id="city-input" placeholder="Enter city name" >
          <button type="submit" id="search-button">
            <p>Search</p><i class="fas fa-search"></i>
          </button>
        </form>
      </div>

      <div class="weather-info">
      <h2 id="city-name">city name,country name</h2>
      <i class="fas fa-sun" id="weather-icon"></i>
      <p id="temperature"> X°C</p>
        
       <div class="extra-info">
         <p id="humidity">Humidity: X%</p>
         <p id="wind-speed">Wind Speed: X m/s</p>
       </div>
      </div>
   
    </div>
  </div>
</body>
</html>
